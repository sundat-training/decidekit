name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The suite runs in a real Chromium through Vitest browser mode.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run lint:typed
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
