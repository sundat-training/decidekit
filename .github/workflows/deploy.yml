name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment, but never cancel a run that is already
# publishing.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A project site lives under /<repo>/, so the bundler base and the router
      # basename both need the prefix. Header-capable hosts keep the root base.
      - run: pnpm run build
        env:
          BASE_PATH: /decidekit/

      # GitHub Pages has no rewrite rules, so deep links fall back to the app
      # shell through the 404 document.
      - name: Add the client-side routing fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
